# API Gateway: entrada unica, so funcoes de borda (sem regra de negocio)

# rate limiting: 10 requisicoes por segundo por IP
limit_req_zone $binary_remote_addr zone=por_ip:10m rate=10r/s;

# log de acesso em JSON, com o correlation id
log_format json escape=json '{"hora":"$time_iso8601","metodo":"$request_method","rota":"$uri",'
                            '"status":$status,"correlationId":"$correlation_id","tempo":$request_time}';

# usa o correlation id que veio do cliente ou cria um
map $http_x_correlation_id $correlation_id {
    default $http_x_correlation_id;
    ""      $request_id;
}

server {
    listen 8000;
    access_log /dev/stdout json;

    limit_req zone=por_ip burst=20 nodelay;
    limit_req_status 429;

    # autenticacao na borda: os servicos internos nao repetem isso
    if ($http_x_api_key != "projac") {
        return 401 '{"erro":"X-Api-Key invalida"}';
    }

    proxy_set_header X-Correlation-ID $correlation_id;
    add_header X-Correlation-ID $correlation_id always;

    # resolver do docker: acha o servico mesmo se ele subir depois do gateway
    resolver 127.0.0.11 valid=10s;
    set $academico http://academico:3000;
    set $sincronizacao http://sincronizacao:3000;
    set $plataforma http://plataforma-aprendizagem:3000;

    location /api/academico/ {
        rewrite ^/api/academico/(.*)$ /$1 break;
        proxy_pass $academico;
    }
    location /api/sincronizacao/ {
        rewrite ^/api/sincronizacao/(.*)$ /$1 break;
        proxy_pass $sincronizacao;
    }
    location /api/plataforma/ {
        rewrite ^/api/plataforma/(.*)$ /$1 break;
        proxy_pass $plataforma;
    }
}
